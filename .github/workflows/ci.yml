name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro'

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  module-tests:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        module: [Home, Library, Player, Profile, Search]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: List simulators
        run: xcrun simctl list devices available

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ matrix.module }}-${{ hashFiles('Modules/**/Package.resolved') }}
          restore-keys: |
            spm-${{ matrix.module }}-

      - name: Test ${{ matrix.module }}
        working-directory: Modules/${{ matrix.module }}
        run: |
          xcodebuild test \
            -scheme ${{ matrix.module }} \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/${{ matrix.module }}.xcresult" \
            -skipPackagePluginValidation

      - name: Coverage summary
        if: always()
        run: |
          BUNDLE="$RUNNER_TEMP/${{ matrix.module }}.xcresult"
          if [ -d "$BUNDLE" ]; then
            {
              echo "### Coverage: ${{ matrix.module }}"
              echo '```'
              xcrun xccov view --report --only-targets "$BUNDLE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.module }}
          path: ${{ runner.temp }}/${{ matrix.module }}.xcresult
          retention-days: 7

  app-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: List simulators
        run: xcrun simctl list devices available

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-app-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-app-

      - name: Build and test app
        run: |
          xcodebuild test \
            -project MusicPreview/MusicPreview.xcodeproj \
            -scheme MusicPreview \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/MusicPreview.xcresult" \
            -skipPackagePluginValidation

      - name: Coverage summary
        if: always()
        run: |
          BUNDLE="$RUNNER_TEMP/MusicPreview.xcresult"
          if [ -d "$BUNDLE" ]; then
            {
              echo "### Coverage: MusicPreview app"
              echo '```'
              xcrun xccov view --report --only-targets "$BUNDLE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-MusicPreview
          path: ${{ runner.temp }}/MusicPreview.xcresult
          retention-days: 7